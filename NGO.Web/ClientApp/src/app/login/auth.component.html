<div class="login-layout">
  <div
    class="login-image"
    [ngStyle]="{ 'background-image': 'url(' + brandImage + ')', 'background-color': brandColor }"
  >
    <h2 class="login-cta title">
      {{ this.orgWelMsg }} <br />
      <br />
      Login Now!!!
    </h2>
  </div>
  <div class="login-form">
    <div class="card-login">
      <div class="py-sm-2 shadow border-0 card-bg">
        <div>
          <div class="text-muted text-center pt-3 mb-3" style="font-size: large">
            <b>Welcome to {{ this.orgName }}</b>
          </div>
        </div>
        <div class="card-body px-lg-5 py-lg-5">
          <div class="text-center text-muted mb-4">
            <small>Sign in with credentials</small>
          </div>
          <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="form-group mb-3">
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="ni ni-email-83"></i></span>
                </div>
                <input class="form-control" formControlName="username" placeholder="Email" type="email" />
              </div>
            </div>
            <div class="form-group">
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="ni ni-lock-circle-open"></i>
                  </span>
                </div>
                <div class="password-container">
                  <input
                    class="form-control"
                    formControlName="password"
                    placeholder="Password"
                    [type]="passwordVisible ? 'text' : 'password'"
                  />

                  <i
                    class="fa password-icon"
                    [ngClass]="passwordVisible ? 'fa-eye-slash' : 'fa-eye'"
                    (click)="togglePasswordVisibility()"
                  ></i>
                </div>
              </div>
            </div>
            <!-- <div class="custom-control custom-control-alternative custom-checkbox">
              <input class="custom-control-input" id=" customCheckLogin" type="checkbox">
              <label class="custom-control-label" for=" customCheckLogin">
                <span class="text-muted">Remember me</span> 
              </label>
            </div> -->
            <div class="alert alert-danger" *ngIf="error && !loginForm.dirty">
              {{ errorMessage }}
            </div>
            <div class="text-center">
              <button type="button" type="submit" class="btn btn-primary my-4">Sign in</button>
            </div>
          </form>
        </div>
      </div>

      <div class="mt-3">
        <div class="col-12 links">
          <a (click)="forgotPassword()" style="float: left; color: black" class="text-dark"><p>Forgot password?</p></a>

          <a [routerLink]="['/signup', this.orgId]" style="float: right; color: black" class="text-dark"
            ><p>Sign Up</p></a
          >
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Page content -->

<div class="flex justify-center">
  <p-toast [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }" />
</div>

<ngo-loading-spinner></ngo-loading-spinner>
