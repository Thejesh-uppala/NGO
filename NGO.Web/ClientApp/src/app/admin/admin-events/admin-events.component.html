<div class="dashboard-parent-component">
  <app-sidebar></app-sidebar>
  <div class="card mt-4 w-full">
    <p-table
      #dt
      [value]="filteredEventsList"
      [(selection)]="selectedEvents"
      dataKey="id"
      [rowHover]="true"
      [rows]="6"
      [showCurrentPageReport]="true"
      [rowsPerPageOptions]="[6, 10, 20]"
      [loading]="loading"
      class="responsive-text"
      [paginator]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [filterDelay]="0"
      [globalFilterFields]="['eventTitle', 'eventDesc']"
    >
      <ng-template pTemplate="caption">
        <div class="flex" style="justify-content: space-between">
          <p-button
            class="responsive-text"
            [outlined]="true"
            icon="pi pi-filter-slash"
            label="Clear"
            (click)="clear(dt)"
          />
          <div>
            <span class="p-input-icon-left ml-2 lg-screen">
              <i class="pi pi-search"></i>
              <input
                pInputText
                type="text"
                (input)="filterGlobal($event)"
                class="responsive-text input-search"
                placeholder="Search..."
              />
            </span>
            <p-button
              class="responsive-text"
              class="ml-2"
              [outlined]="true"
              icon="pi pi-plus"
              label="Create Event"
              (onClick)="createEvent()"
            />
          </div>
        </div>
        <div class="search-container mobile mt-4">
          <span class="p-input-icon-left mobile search-container">
            <i class="pi pi-search"></i>
            <input
              pInputText
              type="text"
              (input)="filterGlobal($event)"
              class="responsive-text input-search w-full"
              placeholder="Search..."
            />
          </span>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr class="responsive-text">
          <th style="width: 4rem">
            <p-tableHeaderCheckbox />
          </th>
          <th pSortableColumn="eventTitle" style="min-width: 14rem">
            <div class="flex justify-between items-center">
              Event Title
              <p-sortIcon field="eventTitle" />
              <p-columnFilter type="text" field="eventTitle" display="menu" class="ml-auto" />
            </div>
          </th>
          <th pSortableColumn="eventPhoto" style="min-width: 8rem">
            <div class="flex justify-between items-center">Photo</div>
          </th>

          <th pSortableColumn="eventAccess" style="min-width: 12rem">
            <div class="flex justify-between items-center">
              Event Access
              <p-sortIcon field="eventAccess" />
              <p-columnFilter type="text" field="eventAccess" display="menu" class="ml-auto" />
            </div>
          </th>

          <th pSortableColumn="eventDate" style="min-width: 10rem">
            <div class="flex justify-between items-center">
              Date
              <p-sortIcon field="eventDate" />
              <p-columnFilter type="date" field="eventDate" display="menu" class="ml-auto" />
            </div>
          </th>

          <th style="width: 5rem">Action</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-event>
        <tr class="p-selectable-row responsive-text" [routerLink]="['/events', event.orgId, event.id]">
          <td (click)="$event.stopPropagation()">
            <p-tableCheckbox [value]="event" />
          </td>
          <td>
            {{ event.eventTitle }}
          </td>
          <td>
            <div class="flex items-center">
              <img alt="Photo" [src]="event?.eventPhoto" width="60" height="40" style="vertical-align: middle" />
            </div>
          </td>

          <td>
            {{ event.eventAccess }}
          </td>
          <td>
            {{ event.eventDate | date: 'MM/dd/yyyy' }}
          </td>

          <td (click)="$event.stopPropagation()">
            <div class="flex gap-2">
              <p-button
                tooltipPosition="left"
                icon="pi pi-pencil"
                [rounded]="true"
                pTooltip="Edit Event"
                [outlined]="true"
                severity="info"
                (click)="navigateToEditEvent(event?.id)"
              />

              <p-button
                icon="pi pi-trash"
                [rounded]="true"
                pTooltip="Delete Event"
                [outlined]="true"
                severity="danger"
                (click)="deleteEvent(event.id)"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr class="responsive-text">
          <td colspan="8">No Events found.</td>
        </tr>
      </ng-template>
    </p-table>
    <p-confirmDialog
      #cd
      key="confirmDelete"
      [style]="{ width: '450px', borderRadius: '8px', boxShadow: '0 4px 12px rgba(0,0,0,0.15)' }"
      [baseZIndex]="10000"
      rejectButtonStyleClass="p-button-text p-button-danger mr-2"
      acceptButtonStyleClass="p-button-primary"
      position="top"
    >
      <ng-template pTemplate="message">
        <div class="flex flex-column w-full gap-3">
          <div class="flex align-items-center gap-2">
            <i class="pi pi-exclamation-triangle text-orange-500" style="font-size: 2rem"></i>
            <span>Are you sure you want to delete this Event ?</span>
          </div>
          <div class="text-sm text-gray-600">Note: Please export the registered users data before deleting.</div>
          <p-button
            [outlined]="true"
            icon="pi pi-users"
            label="View Users"
            (click)="navigateToEvent(); cd.reject()"
            class="p-button-sm"
          ></p-button>
        </div>
      </ng-template>
    </p-confirmDialog>
  </div>
</div>
<div class="flex justify-center">
  <p-toast [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }" />
</div>
